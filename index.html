<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Reforma Tributária</title>
    <style>
        /* ========================================= */
        /* ESTILOS GERAIS E LAYOUT                   */
        /* ========================================= */
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #334155;
            --border-color: #cbd5e1;
            --card-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0b0f19;
                --text-main: #f8fafc;
                --text-muted: #cbd5e1;
                --border-color: #334155;
                --card-bg: #1e293b;
            }
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 950px;
            width: 100%;
        }

        h1 { margin-bottom: 5px; }
        p.subtitle { margin-top: 0; margin-bottom: 25px; color: var(--text-muted); }

        /* ========================================= */
        /* FORMULÁRIOS                               */
        /* ========================================= */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input, select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: #f97316; /* Cor primária do botão */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        button:hover { background-color: #ea580c; }

        .hidden { display: none !important; }

        /* ========================================= */
        /* RESULTADOS E CARDS                        */
        /* ========================================= */
        .results-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 20px;
        }

        .result-col {
            flex: 1;
            min-width: 300px;
        }

        .result-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .card-asis { border-left: 6px solid #64748b; }
        .card-tobe { border-left: 6px solid #2563eb; }

        .result-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
        }
        
        .card-badge {
            font-size: 0.8rem;
            background-color: #e2e8f0;
            color: #475569;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: inline-block;
            font-weight: 600;
        }
        
        @media (prefers-color-scheme: dark) {
            .card-badge {
                background-color: #334155;
                color: #cbd5e1;
            }
        }

        .card-divider {
            border: 0;
            border-top: 1px solid var(--border-color);
            margin: 10px 0;
        }

        .card-item {
            font-size: 0.95rem;
            margin: 8px 0;
        }

        .card-list {
            margin: 8px 0;
            padding-left: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .card-list li { margin-bottom: 6px; }
        .card-list li b { color: var(--text-main); }
        .hidden-item { visibility: hidden; }

        .highlight-cost {
            margin-top: auto;
            padding: 14px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.05rem;
            text-align: center;
        }

        /* Cores fixas da caixa de destaque */
        .highlight-cost-box {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }
        
        @media (prefers-color-scheme: dark) {
            .highlight-cost-box {
                background-color: #0f172a;
                color: #93c5fd;
                border-color: #1e3a8a;
            }
        }

        /* ========================================= */
        /* BANNERS DE STATUS                         */
        /* ========================================= */
        .status-banner {
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.05rem;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .status-success { background-color: #dcfce7; color: #14532d; border: 1px solid #bbf7d0; }
        .status-warning { background-color: #fef3c7; color: #78350f; border: 1px solid #fde68a; }
        .status-neutral { background-color: #f1f5f9; color: #1e293b; border: 1px solid #e2e8f0; }

        @media (max-width: 640px) {
            body { padding: 10px; }
            .result-col { min-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧮 Simulador da Reforma Tributária Teste</h1>
    <p class="subtitle">Compare o custo líquido de aquisição atual (<b>AS IS</b>) com a projeção pós-reforma (<b>TO BE</b>).</p>

    <!-- FORMULÁRIO -->
    <div class="form-row">
        <!-- CAMPO: Departamento -->
        <div class="form-group">
            <label>Departamento</label>
            <select id="departamento" onchange="atualizarCampos()">
                <option value="">-- Selecione --</option>
                <option value="Diretos">Diretos</option>
                <option value="Indiretos">Indiretos</option>
                <option value="Facção">Facção</option>
            </select>
        </div>
        
        <!-- CAMPO: Tipo de Aquisição -->
        <div class="form-group" id="group_aquisicao">
            <label>Tipo de Aquisição</label>
            <select id="cenario" onchange="atualizarCampos()">
                <option value="">-- Selecione --</option>
                <option value="Cenário 1">Aquisição de Matéria-Prima</option>
                <option value="Cenário 2">Aquisição de Serviços</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>Regime do Fornecedor</label>
            <select id="regime" onchange="atualizarCampos()">
                <option value="">-- Selecione --</option>
                <option value="Lucro Real">Lucro Real</option>
                <option value="Lucro Presumido">Lucro Presumido</option>
                <option value="Simples Nacional">Simples Nacional</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="flex: 2;">
            <label>Valor Total da Fatura Atual (R$)</label>
            <input type="text" id="valorFatura" placeholder="Ex: 100.000,00">
        </div>

        <div class="form-group hidden" id="group_icms" style="flex: 1;">
            <label>Alíquota ICMS</label>
            <select id="icms">
                <option value="">-- Selecione --</option>
                <option value="12%">12%</option>
                <option value="17%">17%</option>
            </select>
        </div>

        <div class="form-group hidden" id="group_iss" style="flex: 1;">
            <label>Alíquota ISS (%)</label>
            <input type="number" id="iss" placeholder="Ex: 2 a 5" min="2" max="5" step="0.1">
        </div>

        <div class="form-group hidden" id="group_sn" style="flex: 1;">
            <label>Alíquota Simples (%)</label>
            <input type="number" id="sn" placeholder="Ex: 1 a 19" min="1" max="19" step="0.1">
        </div>
    </div>

    <button onclick="calcularReforma()">🔄 Calcular Comparativo</button>

    <!-- ÁREA DE RESULTADOS -->
    <div id="statusOutput"></div>

    <div class="results-row hidden" id="resultsArea">
        <div class="result-col" id="outAsIs"></div>
        <div class="result-col" id="outToBe"></div>
    </div>
</div>

<!-- LÓGICA JAVASCRIPT -->
<script>
    // 1. Função para formatar números em Reais (BRL)
    function formatarMoeda(valor) {
        return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 2. Tradução da função Python converter_para_float
    function converterParaFloat(valorStr) {
        if (!valorStr) return 0.0;
        let s = String(valorStr).trim().replace(/R\$/g, "").replace(/\s/g, "");
        
        if (s.includes(",") && s.includes(".")) {
            s = s.replace(/\./g, "").replace(/,/g, ".");
        } else if (s.includes(",")) {
            s = s.replace(/,/g, ".");
        }
        
        let valor = parseFloat(s);
        return isNaN(valor) ? 0.0 : valor;
    }

    // 3. Atualizar campos visíveis e recriar opções do select dinamicamente
    function atualizarCampos() {
        const departamento = document.getElementById('departamento').value;
        const groupAquisicao = document.getElementById('group_aquisicao');
        const cenarioSelect = document.getElementById('cenario');
        
        let currentCenario = cenarioSelect.value;
        
        // REGRAS DE NEGÓCIO DA INTERFACE
        if (departamento === "Indiretos") {
            groupAquisicao.classList.remove('hidden');
            cenarioSelect.innerHTML = `
                <option value="">-- Selecione --</option>
                <option value="Material">Material</option>
                <option value="Cenário 2">Aquisição de Serviços</option>
            `;
            if (currentCenario !== "Material" && currentCenario !== "Cenário 2") {
                currentCenario = "";
            }
            
        } else if (departamento === "Diretos" || departamento === "Facção") {
            groupAquisicao.classList.add('hidden');
            cenarioSelect.innerHTML = `
                <option value="Cenário 1">Aquisição de Matéria-Prima</option>
            `;
            currentCenario = "Cenário 1";
            
        } else {
            groupAquisicao.classList.remove('hidden');
            cenarioSelect.innerHTML = `
                <option value="">-- Selecione --</option>
                <option value="Cenário 1">Aquisição de Matéria-Prima</option>
                <option value="Cenário 2">Aquisição de Serviços</option>
            `;
            if (currentCenario !== "Cenário 1" && currentCenario !== "Cenário 2") {
                currentCenario = "";
            }
        }
        
        cenarioSelect.value = currentCenario;

        const cenario = cenarioSelect.value;
        const regime = document.getElementById('regime').value;

        // ICMS escondido se for Facção, pois não há tomada de crédito de ICMS neste departamento
        const showIcms = ((cenario === "Cenário 1" || cenario === "Material") && 
                          (regime === "Lucro Real" || regime === "Lucro Presumido") && 
                          (departamento !== "Facção"));
                          
        const showIss = (cenario === "Cenário 2");
        const showSn = (regime === "Simples Nacional");

        document.getElementById('group_icms').className = showIcms ? 'form-group' : 'form-group hidden';
        document.getElementById('group_iss').className = showIss ? 'form-group' : 'form-group hidden';
        document.getElementById('group_sn').className = showSn ? 'form-group' : 'form-group hidden';
    }

    // 4. Lógica principal de cálculo
    function calcularReforma() {
        const departamento = document.getElementById('departamento').value;
        let cenario = document.getElementById('cenario').value;
        const regime = document.getElementById('regime').value;
        const valorRaw = document.getElementById('valorFatura').value;
        const icmsInput = document.getElementById('icms').value;
        const issInput = parseFloat(document.getElementById('iss').value);
        const snInput = parseFloat(document.getElementById('sn').value);

        const statusOut = document.getElementById('statusOutput');
        const asIsOut = document.getElementById('outAsIs');
        const toBeOut = document.getElementById('outToBe');
        const resultsArea = document.getElementById('resultsArea');

        // Reset
        statusOut.innerHTML = "";
        resultsArea.classList.add('hidden');

        // VALIDAÇÕES
        if (!departamento) {
            statusOut.innerHTML = "<div class='status-banner status-warning'>⚠️ <b>Atenção:</b> Selecione o Departamento.</div>";
            return;
        }
        if (departamento === "Diretos" || departamento === "Facção") {
            cenario = "Cenário 1"; // Trava de segurança
        }
        if (!cenario) {
            statusOut.innerHTML = "<div class='status-banner status-warning'>⚠️ <b>Atenção:</b> Selecione o Tipo de Aquisição.</div>";
            return;
        }
        if (!regime) {
            statusOut.innerHTML = "<div class='status-banner status-warning'>⚠️ <b>Atenção:</b> Selecione o Regime do Fornecedor.</div>";
            return;
        }
        const totalFaturaAsis = converterParaFloat(valorRaw);
        if (totalFaturaAsis <= 0) {
            statusOut.innerHTML = "<div class='status-banner status-warning'>❌ <b>Erro:</b> Insira um valor válido para a Fatura Atual.</div>";
            return;
        }

        let snRate = 0;
        if (regime === "Simples Nacional") {
            if (isNaN(snInput) || snInput < 1 || snInput > 19) {
                statusOut.innerHTML = "<div class='status-banner status-warning'>❌ <b>Erro:</b> Insira o valor do Simples Nacional (1% a 19%).</div>";
                return;
            }
            snRate = snInput / 100.0;
        }

        if ((cenario === "Cenário 1" || cenario === "Material") && (regime === "Lucro Real" || regime === "Lucro Presumido") && departamento !== "Facção") {
            if (!icmsInput) {
                statusOut.innerHTML = "<div class='status-banner status-warning'>⚠️ <b>Atenção:</b> Selecione a alíquota de ICMS.</div>";
                return;
            }
        }

        let issRate = 0;
        if (cenario === "Cenário 2") {
            if (isNaN(issInput) || issInput < 2 || issInput > 5) {
                statusOut.innerHTML = "<div class='status-banner status-warning'>❌ <b>Erro:</b> Insira o valor do ISS (2% a 5%).</div>";
                return;
            }
            issRate = issInput / 100.0;
        }

        // VARIÁVEIS DE CÁLCULO
        let precoSemImposto = 0, custoLiquidoAsis = 0, custoLiquidoTobe = 0;
        let totalFaturaTobe = 0, detalheAsis = "", detalheTobe = "";

        // Captura do ICMS (zerado automaticamente se for Facção)
        let icmsRate = 0;
        if (departamento !== "Facção") {
            if (icmsInput === "17%") icmsRate = 0.17;
            else if (icmsInput === "12%") icmsRate = 0.12;
        }

        // =========================================================================
        // CENÁRIO 1 E MATERIAL
        // =========================================================================
        if (cenario === "Cenário 1" || cenario === "Material") {
            
            // --- 1. CÁLCULO AS IS (Com base no Departamento) ---
            let icmsValAsis = 0;
            let piscofinsValAsis = 0;

            if (departamento === "Indiretos") {
                // Sem crédito
                custoLiquidoAsis = totalFaturaAsis;
                detalheAsis = `<li><b>ICMS:</b> R$ 0,00 <i>(Sem crédito)</i></li><li><b>PIS/COFINS:</b> R$ 0,00 <i>(Sem crédito)</i></li>`;
            
            } else if (departamento === "Facção") {
                // Crédito 9.25% de PIS/COFINS (Sem ICMS)
                piscofinsValAsis = totalFaturaAsis * 0.0925;
                custoLiquidoAsis = totalFaturaAsis - piscofinsValAsis;
                detalheAsis = `<li><b>ICMS:</b> R$ 0,00 <i>(Sem crédito)</i></li><li><b>PIS/COFINS:</b> R$ ${formatarMoeda(piscofinsValAsis)} <i>(Crédito 9,25%)</i></li>`;
            
            } else if (departamento === "Diretos") {
                // Crédito ICMS (se houver) e Crédito 9.25% PIS/COFINS
                icmsValAsis = totalFaturaAsis * icmsRate;
                piscofinsValAsis = (totalFaturaAsis - icmsValAsis) * 0.0925;
                custoLiquidoAsis = totalFaturaAsis - icmsValAsis - piscofinsValAsis;
                detalheAsis = `<li><b>ICMS:</b> R$ ${formatarMoeda(icmsValAsis)}</li><li><b>PIS/COFINS:</b> R$ ${formatarMoeda(piscofinsValAsis)} <i>(Crédito 9,25%)</i></li>`;
            }

            // Se for Simples Nacional, adiciona a linha informativa que havia no código original AS IS
            if (regime === "Simples Nacional") {
                const infoSimplesAsis = `<li><b>Simples Nacional:</b> R$ ${formatarMoeda(totalFaturaAsis * 0.04)} <i>(Na NF)</i></li>`;
                detalheAsis += infoSimplesAsis;
            }

            // --- 2. CÁLCULO TO BE (Memória original mantida intacta) ---
            if (regime === "Lucro Real") {
                const piscofinsRate = 0.0925;
                precoSemImposto = totalFaturaAsis * (1 - icmsRate) * (1 - piscofinsRate);
                
                const precoNotaTobe = precoSemImposto / (1 - icmsRate);
                const cbsValTobe = precoSemImposto * 0.09;
                totalFaturaTobe = precoNotaTobe + cbsValTobe;
                
                const icmsCredTobe = precoNotaTobe * icmsRate;
                const cbsCredTobe = cbsValTobe;
                custoLiquidoTobe = totalFaturaTobe - icmsCredTobe - cbsCredTobe;
                
                detalheTobe = `<li><b>ICMS:</b> R$ ${formatarMoeda(precoNotaTobe * icmsRate)}</li><li><b>PIS/COFINS:</b> R$ 0,00 <i>(Extinto)</i></li><li><b>CBS:</b> R$ ${formatarMoeda(cbsValTobe)}</li>`;
                
            } else if (regime === "Lucro Presumido") {
                const piscofinsRate = 0.0365;
                precoSemImposto = totalFaturaAsis * (1 - icmsRate) * (1 - piscofinsRate);
                
                const precoNotaTobe = precoSemImposto / (1 - icmsRate);
                const cbsValTobe = precoNotaTobe * 0.09;
                totalFaturaTobe = precoNotaTobe + cbsValTobe;
                
                const icmsCredTobe = precoNotaTobe * icmsRate;
                const cbsCredTobe = cbsValTobe;
                custoLiquidoTobe = totalFaturaTobe - icmsCredTobe - cbsCredTobe;
                
                detalheTobe = `<li><b>ICMS:</b> R$ ${formatarMoeda(precoNotaTobe * icmsRate)}</li><li><b>PIS/COFINS:</b> R$ 0,00 <i>(Extinto)</i></li><li><b>CBS:</b> R$ ${formatarMoeda(cbsValTobe)}</li>`;

            } else { // Simples Nacional
                const simplesRate = 0.04;
                precoSemImposto = totalFaturaAsis * (1 - simplesRate);
                
                totalFaturaTobe = totalFaturaAsis;
                const simplesCredTobe = totalFaturaTobe * snRate;
                custoLiquidoTobe = totalFaturaTobe - simplesCredTobe;
                
                detalheTobe = `<li><b>ICMS:</b> R$ 0,00</li><li><b>PIS/COFINS:</b> R$ 0,00 <i>(Extinto)</i></li><li><b>Simples Nacional:</b> R$ ${formatarMoeda(simplesCredTobe)}</li>`;
            }
        } 
        
        // =========================================================================
        // CENÁRIO 2: SERVIÇOS
        // =========================================================================
        else {
            let piscofinsRate = 0.0;
            if (regime === "Lucro Real") piscofinsRate = 0.0925;
            else if (regime === "Lucro Presumido") piscofinsRate = 0.0365;

            const aliquotaTotalAsis = issRate + piscofinsRate;
            precoSemImposto = totalFaturaAsis * (1 - aliquotaTotalAsis);

            const issValAsis = totalFaturaAsis * issRate;
            const piscofinsValAsis = totalFaturaAsis * piscofinsRate;
            
            // AS IS para Serviços não tomava crédito originalmente e Indiretos também não.
            custoLiquidoAsis = totalFaturaAsis; 

            if (departamento === "Indiretos") {
                detalheAsis = `<li><b>ISS:</b> R$ ${formatarMoeda(issValAsis)} <i>(Sem crédito)</i></li><li><b>PIS/COFINS:</b> R$ ${formatarMoeda(piscofinsValAsis)} <i>(Sem crédito)</i></li>`;
            } else {
                detalheAsis = `<li><b>ISS:</b> R$ ${formatarMoeda(issValAsis)}</li><li><b>PIS/COFINS:</b> R$ ${formatarMoeda(piscofinsValAsis)}</li>`;
            }

            const issTobe = issRate;
            const precoNotaTobe = precoSemImposto / (1 - issTobe);
            const cbsValTobe = precoNotaTobe * 0.09;
            
            totalFaturaTobe = precoNotaTobe + cbsValTobe;
            custoLiquidoTobe = totalFaturaTobe - cbsValTobe;
            
            detalheTobe = `<li><b>ISS:</b> R$ ${formatarMoeda(precoNotaTobe * issTobe)}</li><li><b>PIS/COFINS:</b> R$ 0,00 <i>(Extinto)</i></li><li><b>CBS:</b> R$ ${formatarMoeda(cbsValTobe)}</li>`;
        }

        // =========================================================================
        // RENDERIZAÇÃO DA INTERFACE
        // =========================================================================
        const variacao = custoLiquidoAsis - custoLiquidoTobe;
        const pctVariacao = custoLiquidoAsis > 0 ? (Math.abs(variacao) / custoLiquidoAsis) * 100 : 0;

        let statusHtml = "";
        if (Math.abs(variacao) < 0.01) {
            statusHtml = "<div class='status-banner status-neutral'>⚖️ <b>SEM IMPACTO NO CUSTO LÍQUIDO</b></div>";
        } else if (variacao > 0) {
            statusHtml = `<div class='status-banner status-success'>✅ <b>GANHO DE CUSTO:</b> Economia de <b>R$ ${formatarMoeda(variacao)}</b> (${pctVariacao.toFixed(2)}% de redução)</div>`;
        } else {
            statusHtml = `<div class='status-banner status-warning'>⚠️ <b>AUMENTO DE CUSTO:</b> Elevação de <b>R$ ${formatarMoeda(Math.abs(variacao))}</b> (+${pctVariacao.toFixed(2)}% no custo)</div>`;
        }
        
        const nomeCenario = cenario === "Cenário 1" ? "Matéria-Prima" : (cenario === "Cenário 2" ? "Serviços" : cenario);
        const deptoBadge = `<span class="card-badge">Depto: ${departamento} | Tipo: ${nomeCenario}</span>`;

        // CORREÇÃO: "Custo Total Líquido" agora reflete a variável correta "custoLiquidoAsis/Tobe" ao invés do precoSemImposto
        const htmlAsis = `
            <div class='result-card card-asis'>
                <h3>📊 COMO ESTÁ (Cenário Atual)</h3>
                ${deptoBadge}
                <hr class='card-divider'>
                <p class='card-item'><b>Total da Fatura:</b> R$ ${formatarMoeda(totalFaturaAsis)}</p>
                <ul class='card-list'>${detalheAsis}</ul>
                <p class='card-item'><b>Custo Total Líquido:</b> R$ ${formatarMoeda(custoLiquidoAsis)}</p>
                <div class='highlight-cost highlight-cost-box'>CUSTO TOTAL DA FATURA:<br><b>R$ ${formatarMoeda(totalFaturaAsis)}</b></div>
            </div>`;

        const htmlTobe = `
            <div class='result-card card-tobe'>
                <h3>🚀 TO BE (Reforma 2027)</h3>
                ${deptoBadge}
                <hr class='card-divider'>
                <p class='card-item'><b>Total da Fatura:</b> R$ ${formatarMoeda(totalFaturaTobe)}</p>
                <ul class='card-list'>${detalheTobe}</ul>
                <p class='card-item'><b>Custo Total Líquido:</b> R$ ${formatarMoeda(custoLiquidoTobe)}</p>
                <div class='highlight-cost highlight-cost-box'>CUSTO TOTAL DA FATURA:<br><b>R$ ${formatarMoeda(totalFaturaTobe)}</b></div>
            </div>`;

        statusOut.innerHTML = statusHtml;
        asIsOut.innerHTML = htmlAsis;
        toBeOut.innerHTML = htmlTobe;
        resultsArea.classList.remove('hidden');
    }
</script>
